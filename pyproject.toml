[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-trader"
version = "0.1.0"
description = "Dual-market local simulation experiment driven by the MaleCNS connectome"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3,<3",
  "scipy>=1.16,<2",
  "pandas>=2.3,<4",
  "longbridge>=5,<6",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
fly-trader = "fly_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fly_trader = ["web/*.html", "web/*.css", "web/*.js", "calendars/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
